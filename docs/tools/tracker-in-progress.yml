# Moves an issue forward on the board from its branch name <type>/<number>-<slug>,
# e.g. feat/1049-ble-reconnect:
#   first push of the branch  -> In Progress
#   pull request opened       -> Review (GitHub's own "linked" workflow needs
#                                "Closes #N", which a PR with a test still
#                                owed does not say)
# An issue already further along is left where it is; branches without a
# number are ignored. Copy to .github/workflows/; see issue-tracker.md › Board.
#
# Needs, in the repository settings:
#   variable TRACKER_PROJECT  the board as <owner>/<number>, e.g. my-org/2
#   secret   PROJECT_TOKEN    a token that can write that board (the built-in
#                             GITHUB_TOKEN reaches only this repository, and an
#                             organization's board is not part of it)
name: tracker-in-progress

on:
  create:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  move:
    if: github.event_name == 'pull_request' || github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: issue
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMAND: ${{ github.event_name == 'pull_request' && 'review' || 'start' }}
        run: |
          if [[ "$BRANCH" =~ ^[a-z]+/([0-9]+)(-|$) ]]; then
            echo "number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "command=$COMMAND" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.issue.outputs.number
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs/tools
      - if: steps.issue.outputs.number
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT: ${{ vars.TRACKER_PROJECT }}
        run: >
          python3 docs/tools/tracker.py "${{ steps.issue.outputs.command }}"
          "${{ steps.issue.outputs.number }}"
          --project "$PROJECT" --repo "$GITHUB_REPOSITORY"
